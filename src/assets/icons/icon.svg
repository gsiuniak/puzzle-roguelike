<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Puzzle Roguelike">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#271c3b"/>
      <stop offset="60%" stop-color="#140e22"/>
      <stop offset="100%" stop-color="#07050d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e7b4"/>
      <stop offset="55%" stop-color="#e0b85a"/>
      <stop offset="100%" stop-color="#a9802f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (safe to be cropped by maskable masks) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Gold ring emblem (kept within the maskable safe zone) -->
  <circle cx="256" cy="244" r="150" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="256" cy="244" r="132" fill="none" stroke="#000" stroke-opacity="0.30" stroke-width="3"/>

  <!-- Compass star at the top of the ring -->
  <path d="M256 150 L268 212 L256 224 L244 212 Z" fill="url(#gold)"/>
  <path d="M256 150 L244 212 L256 224 L268 212 Z" fill="#000" fill-opacity="0.18"/>

  <!-- Five element gems in a row (red / blue / green / yellow / purple) -->
  <g stroke="url(#gold)" stroke-width="4">
    <circle cx="144" cy="300" r="22" fill="#d9534f"/>
    <circle cx="200" cy="300" r="22" fill="#4f8fe0"/>
    <circle cx="256" cy="300" r="22" fill="#5cb85c"/>
    <circle cx="312" cy="300" r="22" fill="#e6c34a"/>
    <circle cx="368" cy="300" r="22" fill="#9b59e0"/>
  </g>
</svg>
