<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Roguelike - Battle Test</title>
  <style>
  @font-face {
    font-family: 'Marcellus SC';
    src: url('assets/fonts/MarcellusSC-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* ── Rotate-device overlay ──
     Shown only in portrait orientation. Pure CSS — no JS needed.
     Hiding the canvas also blocks pointer/touch input on the game. */
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    color: #d8c890;
    font-family: 'Marcellus SC', serif;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #rotate-overlay .icon {
    font-size: 72px;
    margin-bottom: 16px;
    display: block;
  }
  #rotate-overlay .msg {
    font-size: 26px;
    line-height: 1.5;
  }

  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
    canvas { visibility: hidden; }
  }
</style>
</head>
<body>
  <div id="rotate-overlay">
    <div>
      <span class="icon">&#x21BB;</span>
      <div class="msg">Please rotate your device<br>to landscape orientation</div>
    </div>
  </div>
  <script src="js/lib/howler.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
