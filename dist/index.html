<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover extends behind iOS notch/safe-area; no zoom for game UX -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS Safari "Add to Home Screen" → fullscreen-style standalone launch -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puzzle Roguelike">
  <!-- Android/Chrome standalone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Puzzle Roguelike - Battle Test</title>
  <style>
  @font-face {
    font-family: 'Marcellus SC';
    src: url('./bundle/MarcellusSC-Regular-BaJAEWe7.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    /* Disable browser default touch handling (scroll/pinch/double-tap zoom)
       so the game's InputManager sees raw touchstart/move/end. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Fullscreen toggle button ──
     Floating bottom-right. Hides automatically when fullscreen is active
     (via .is-fs class set from JS) and in portrait orientation. */
  #fullscreen-btn {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 1000;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(216, 200, 144, 0.5);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    color: #d8c890;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 120ms ease, transform 120ms ease;
  }
  #fullscreen-btn:hover  { background: rgba(40, 30, 14, 0.85); }
  #fullscreen-btn:active { transform: scale(0.94); }
  /* Hide when in fullscreen (toggled from JS) */
  #fullscreen-btn.is-fs { display: none; }

  /* ── Rotate-device overlay ──
     Shown only in portrait orientation. Pure CSS — no JS needed.
     Hiding the canvas also blocks pointer/touch input on the game. */
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    color: #d8c890;
    font-family: 'Marcellus SC', serif;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #rotate-overlay .icon {
    font-size: 72px;
    margin-bottom: 16px;
    display: block;
  }
  #rotate-overlay .msg {
    font-size: 26px;
    line-height: 1.5;
  }

  @media (orientation: portrait) {
    #rotate-overlay   { display: flex; }
    canvas            { visibility: hidden; }
    #fullscreen-btn   { display: none; }
  }
</style>
  <script type="module" crossorigin src="./bundle/index-DpyLsEON.js"></script>
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body>
  <div id="rotate-overlay">
    <div>
      <span class="icon">&#x21BB;</span>
      <div class="msg">Please rotate your device<br>to landscape orientation</div>
    </div>
  </div>
  <button id="fullscreen-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>
  <script src="js/lib/howler.js"></script>
</body>
</html>
