<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover extends behind iOS notch/safe-area; no zoom for game UX -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS Safari "Add to Home Screen" → fullscreen-style standalone launch -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puzzle Rogue">
  <!-- Android/Chrome standalone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <!-- iOS home-screen icon (manifest icons are ignored by iOS Safari) -->
  <link rel="apple-touch-icon" href="./bundle/icon-512-CJlw8sF1.jpg">
  <title>Puzzle Rogue</title>
  <style>
  @font-face {
    font-family: 'Marcellus SC';
    src: url('./bundle/MarcellusSC-Regular-BaJAEWe7.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  /* Damage-counter display faces: Cinzel for the DAMAGE/CHAIN words,
     Avengeance Mightiest Avenger for the big numbers. Self-hosted (no network)
     so they work on raw serve + offline PWA, like Marcellus above. */
  @font-face {
    font-family: 'Cinzel';
    src: url('./bundle/Cinzel-Bold-CfyjOJCS.otf') format('opentype');
    /* Declare a weight RANGE so the damage text's 800 request maps to this one
       bold OTF without the browser synthesizing a faux-heavier weight. */
    font-weight: 700 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Avengeance Mightiest Avenger';
    src: url('./bundle/AVENGEANCE%20MIGHTIEST%20AVENGER-DMe_4YVP.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'ExtraOld';
    src: url('./bundle/ExtraOld-BKLxMRp0.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    /* Disable browser default touch handling (scroll/pinch/double-tap zoom)
       so the game's InputManager sees raw touchstart/move/end. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Fullscreen toggle button ──
     Floating bottom-right. Hides automatically when fullscreen is active
     (via .is-fs class set from JS) and in portrait orientation. */
  #fullscreen-btn {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 1000;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(216, 200, 144, 0.5);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    color: #d8c890;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 120ms ease, transform 120ms ease;
  }
  #fullscreen-btn:hover  { background: rgba(40, 30, 14, 0.85); }
  #fullscreen-btn:active { transform: scale(0.94); }
  /* Hide when in fullscreen (toggled from JS) */
  #fullscreen-btn.is-fs { display: none; }
  /* Hide when running as an installed PWA — it's already fullscreen/standalone,
     so the toggle is redundant. Media query covers desktop/Android installed
     apps; the .pwa-standalone class (set from JS) covers iOS Safari. */
  @media (display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui) {
    #fullscreen-btn { display: none !important; }
  }
  html.pwa-standalone #fullscreen-btn { display: none !important; }

  /* ── Install (PWA) button ──
     Hidden until the browser fires `beforeinstallprompt` (i.e. the app is
     installable: HTTPS + manifest + valid icon + service worker). Clicking it
     triggers the native install prompt. Stays hidden where install isn't
     available (raw http serve, iOS Safari, already installed). */
  #install-btn {
    display: none;
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 1000;
    height: 44px;
    padding: 0 16px;
    border: 1px solid rgba(216, 200, 144, 0.6);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.6);
    color: #e0b85a;
    font-family: 'Marcellus SC', serif;
    font-size: 18px;
    line-height: 1;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 120ms ease, transform 120ms ease;
  }
  #install-btn:not([hidden]) { display: flex; }
  #install-btn:hover  { background: rgba(40, 30, 14, 0.9); }
  #install-btn:active { transform: scale(0.96); }

  /* ── Rotate-device overlay ──
     Shown only in portrait orientation. Pure CSS — no JS needed.
     Hiding the canvas also blocks pointer/touch input on the game. */
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    color: #d8c890;
    font-family: 'Marcellus SC', serif;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #rotate-overlay .icon {
    font-size: 72px;
    margin-bottom: 16px;
    display: block;
  }
  #rotate-overlay .msg {
    font-size: 26px;
    line-height: 1.5;
  }

  @media (orientation: portrait) {
    #rotate-overlay   { display: flex; }
    canvas            { visibility: hidden; }
    #fullscreen-btn   { display: none; }
    #install-btn      { display: none !important; }
  }
</style>
  <script type="module" crossorigin src="./bundle/index-qb1fn1IZ.js"></script>
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body>
  <div id="rotate-overlay">
    <div>
      <span class="icon">&#x21BB;</span>
      <div class="msg">Please rotate your device<br>to landscape orientation</div>
    </div>
  </div>
  <button id="fullscreen-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>
  <button id="install-btn" type="button" aria-label="Install app" title="Install app" hidden>&#x2913; Install</button>
  <script src="js/lib/howler.js"></script>
  <!-- PWA install button wiring (self-contained; no-op where install isn't available). -->
  <script>
  (function () {
    // Mark the doc as a standalone/installed PWA so CSS can hide the redundant
    // fullscreen toggle. The display-mode media query handles desktop/Android;
    // this also covers iOS Safari (navigator.standalone).
    if (
      navigator.standalone === true ||
      (window.matchMedia && (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.matchMedia('(display-mode: minimal-ui)').matches
      ))
    ) {
      document.documentElement.classList.add('pwa-standalone');
    }

    var btn = document.getElementById('install-btn');
    var deferred = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();          // suppress the mini-infobar; we drive the prompt
      deferred = e;
      if (btn) btn.hidden = false; // reveal our Install button
    });
    if (btn) btn.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.finally(function () {
        deferred = null;
        btn.hidden = true;
      });
    });
    window.addEventListener('appinstalled', function () {
      if (btn) btn.hidden = true;
    });
  })();
  </script>
</body>
</html>
